name: naavi
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  http: ^1.2.0
  minio: ^3.5.7
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  flutter_dotenv: ^5.1.0
  mapbox_maps_flutter: ^2.11.0
  gif_view: ^1.0.3
  # Dependencies for static routes (Show_path)
  geobase: ^1.5.0
  image: ^4.1.3
  # Dependencies for GPS tracking (feat/homemap)
  geolocator: ^14.0.2
  geolocator_apple: ^2.3.7
  flutter_compass: ^0.8.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  mocktail: ^1.0.4
  turf: ^0.0.9
  flutter_svg: ^2.0.10+1
  video_player: ^2.10.1
  cloudflare_turnstile: ^3.6.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.15

flutter:
  assets:
    - .env
    - assets/maps/
    - assets/icons/
    - assets/icons/recap/alarm.png
    - assets/icons/poi/pets.png
    - assets/icons/recap/directions_walk.png
    - assets/icons/report/hazard.png
    - assets/icons/report/parking.png
    - assets/markers/start-icon.png
    - assets/icons/poi/camping.png
    - assets/icons/poi/toilets.png
    - assets/icons/poi/water.png
    - assets/icons/logo/logo-dark.svg
    - assets/icons/logo/logo-light.svg
    - assets/icons/logo/logo_long-dark.svg

  uses-material-design: true
  fonts:
    - family: Lexend Deca
      fonts:
        - asset: assets/fonts/LexendDeca-Regular.ttf