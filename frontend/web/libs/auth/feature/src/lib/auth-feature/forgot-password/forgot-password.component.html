<div class="p-6 min-w-[400px]">
  <div class="text-center mb-8">
    <h3 class="text-2xl font-bold text-green-800 mb-2">Mot de passe oublié</h3>
    <p class="text-gray-600 text-sm">
      Entrez votre adresse email pour recevoir un lien de réinitialisation
    </p>
  </div>

  <form
    [formGroup]="forgotPasswordForm"
    (ngSubmit)="onSubmit()"
    class="space-y-6"
  >
    <div class="space-y-2">
      <label
        for="reset-email"
        class="block text-sm font-semibold text-green-800"
        >Adresse email</label
      >
      <input
        pInputText
        id="reset-email"
        formControlName="email"
        placeholder="votre@email.com"
        [class.ng-invalid]="email?.invalid && (email?.touched || submitted)"
        class="w-full"
        [pAutoFocus]="true"
      />
      @if (email?.invalid && (email?.touched || submitted)) {
      <small class="text-red-500 text-xs mt-1 block">
        @if (email?.errors?.['required']) {
        <span>L'email est requis</span>
        } @if (email?.errors?.['email']) {
        <span>Format d'email invalide</span>
        }
      </small>
      }
    </div>

    <div class="flex gap-3 pt-4">
      <p-button
        type="button"
        label="Annuler"
        severity="secondary"
        [outlined]="true"
        (onClick)="closeModal.emit()"
        styleClass="flex-1"
      ></p-button>

      <p-button
        type="submit"
        label="Envoyer"
        [loading]="loading"
        [disabled]="forgotPasswordForm.invalid && submitted"
        styleClass="flex-1"
      ></p-button>
    </div>
  </form>
</div>
