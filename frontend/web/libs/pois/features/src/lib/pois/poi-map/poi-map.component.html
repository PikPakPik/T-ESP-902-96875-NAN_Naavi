<mgl-map
  #map
  [style]="'mapbox://styles/mapbox/outdoors-v12'"
  [center]="getMapCenter()"
  [zoom]="12"
  class="w-full h-full"
>
  <mgl-marker [lngLat]="[longitude(), latitude()]" anchor="bottom">
    @if (useCategoryIcon()) {
    <img
      [src]="getMarkerIconPath()"
      [alt]="category() || 'POI'"
      class="poi-marker-icon"
    />
    } @else {
    <div class="poi-marker-dot" aria-label="POI point"></div>
    }
  </mgl-marker>
</mgl-map>
