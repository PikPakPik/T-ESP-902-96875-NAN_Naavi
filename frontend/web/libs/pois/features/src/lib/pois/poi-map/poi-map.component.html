<mgl-map
  #map
  [style]="'mapbox://styles/mapbox/outdoors-v12'"
  [center]="getMapCenter()"
  [zoom]="12"
  class="w-full h-full"
>
  <mgl-geojson-source
    [id]="'source-' + poiId()"
    [data]="coordinatesToGeoJSON()"
  >
  </mgl-geojson-source>

  <!-- Point unique -->
  <mgl-layer
    [id]="'point-' + poiId()"
    type="circle"
    [source]="'source-' + poiId()"
    [paint]="{ 'circle-radius': 8, 'circle-color': '#f97316' }"
  />
</mgl-map>
