<div class="loading-container">
  <div class="loading-content">
    <div class="logo-container">
      <img class="logo" src="./assets/img/logo.png" alt="Logo Naavi" />
      <h1 class="brand-name">Naavi</h1>
    </div>

    <div class="loading-spinner">
      <p-progressSpinner
        [style]="{ width: '50px', height: '50px' }"
        strokeWidth="4"
        animationDuration="1s"
      >
      </p-progressSpinner>
    </div>

    <p class="loading-text">Chargement de votre expérience...</p>
  </div>
</div>
