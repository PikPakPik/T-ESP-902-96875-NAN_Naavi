services:
  spring:
    build:
      context: .
      dockerfile: .docker/java/dev.Dockerfile
    volumes:
      - .docker/java/watch.sh:/usr/share/watch.sh
      - ./spring:/usr/share/app
      - ~/.m2:/root/.m2
      - naavi_shared_data:/usr/share/naavi_shared_data
    environment:
      MAVEN_PROFILES: dev
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/naavi_identity
      SPRING_MAIL_HOST: mailer
      SPRING_MAIL_PORT: 1025
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=naavi-network"

      - "traefik.http.routers.identity.rule=Host(`api.naavi.local`) && PathPrefix(`/identity`) && !PathPrefix(`/identity/internal/`)"
      - "traefik.http.routers.identity.entrypoints=web"
      - "traefik.http.routers.identity.middlewares=identity-stripprefix"

      - "traefik.http.services.identity.loadbalancer.server.port=8080"
      - "traefik.http.services.identity.loadbalancer.healthcheck.path=/healthcheck"
  
      - "traefik.http.middlewares.identity-stripprefix.stripprefix.prefixes=/identity"
    networks:
      default: {}
      naavi-network:
          aliases:
            - identity

  database:
    image: postgres:latest
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: naavi
      POSTGRES_PASSWORD: naavi
      POSTGRES_DB: naavi_identity
      PGDATA: /var/lib/postgresql/data/pgdata

volumes:
  postgres_data: {}
  naavi_shared_data:
    external: true

networks:
  naavi-network:
    external: true