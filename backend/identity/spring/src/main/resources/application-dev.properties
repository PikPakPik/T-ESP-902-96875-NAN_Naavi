spring.application.name=Naavi Identity Development

spring.output.ansi.enabled=always

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/naavi_identity
spring.datasource.username=naavi
spring.datasource.password=naavi
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging configuration
logging.level.org.springframework.boot.devtools=DEBUG

# JWT configuration
jwt.default.private=/usr/share/naavi_shared_data/default.private.pem
jwt.default.public=/usr/share/naavi_shared_data/default.public.pem
jwt.default.password=defaultPassword

jwt.auth.private=/usr/share/naavi_shared_data/auth.private.pem
jwt.auth.public=/usr/share/naavi_shared_data/auth.public.pem
jwt.auth.password=defaultPassword

jwt.exchange.private=/usr/share/naavi_shared_data/exchange.private.pem
jwt.exchange.public=/usr/share/naavi_shared_data/exchange.public.pem
jwt.exchange.password=defaultPassword

# Mail configuration
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=none
spring.mail.password=none
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Naavi configuration
naavi.internal.api-key=${NAAVI_INTERNAL_API-KEY:defaultApiKey}