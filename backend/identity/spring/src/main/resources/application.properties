spring.application.name=Naavi Identity Production

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging configuration
spring.mvc.log-request-details=true
spring.mvc.log-resolved-exception=true
logging.level.root=INFO
logging.level.fr.naavi.identity=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO
logging.level.web=INFO
logging.logback.rollingpolicy.file-name-pattern=logs/identity-app.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# JWT configuration
jwt.issuer=${JWT_ISSUER:identity}
jwt.default.private=${JWT_DEFAULT_PRIVATE:/usr/share/default.private.pem}
jwt.default.public=${JWT_DEFAULT_PUBLIC:/usr/share/default.public.pem}
jwt.default.password=${JWT_DEFAULT_PASSWORD:defaultPassword}

jwt.auth.private=${JWT_AUTH_PRIVATE:/usr/share/auth.private.pem}
jwt.auth.public=${JWT_AUTH_PUBLIC:/usr/share/auth.public.pem}
jwt.auth.password=${JWT_AUTH_PASSWORD:defaultPassword}

jwt.exchange.private=${JWT_EXCHANGE_PRIVATE:/usr/share/exchange.private.pem}
jwt.exchange.public=${JWT_EXCHANGE_PUBLIC:/usr/share/exchange.public.pem}
jwt.exchange.password=${JWT_EXCHANGE_PASSWORD:defaultPassword}

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<login user to smtp server>
spring.mail.password=<login password to smtp server>
spring.mail.from=no-reply@naavi-trails.fr
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Naavi configuration
naavi.internal.api-key=${NAAVI_INTERNAL_API-KEY:defaultApiKey}
cloudflare.turnstile.secret-key=azertyuiop
s3.endpoint=http://s3.naavi.local
s3.access-key=minio
s3.secret-key=miniopwd

# OpenAPI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.configUrl=/identity/api-docs/swagger-config
springdoc.swagger-ui.url=/identity/api-docs

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.server-url=http://api.naavi.local/identity/
springdoc.swagger-ui.title=Naavi Identity API