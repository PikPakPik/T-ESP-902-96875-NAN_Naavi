spring.application.name=Naavi Identity CI

spring.output.ansi.enabled=always

# Database configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging configuration
logging.level.org.springframework.boot.devtools=DEBUG

# JWT configuration
jwt.issuer=identity
jwt.default.private=${JWT_DEFAULT_PRIVATE:/usr/share/default.private.pem}
jwt.default.public=${JWT_DEFAULT_PUBLIC:/usr/share/default.public.pem}
jwt.default.password=${JWT_DEFAULT_PASSWORD:defaultPassword}

jwt.auth.private=${JWT_AUTH_PRIVATE:/usr/share/auth.private.pem}
jwt.auth.public=${JWT_AUTH_PUBLIC:/usr/share/auth.public.pem}
jwt.auth.password=${JWT_AUTH_PASSWORD:defaultPassword}

jwt.exchange.private=${JWT_EXCHANGE_PRIVATE:/usr/share/exchange.private.pem}
jwt.exchange.public=${JWT_EXCHANGE_PUBLIC:/usr/share/exchange.public.pem}
jwt.exchange.password=${JWT_EXCHANGE_PASSWORD:defaultPassword}

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<login user to smtp server>
spring.mail.password=<login password to smtp server>
spring.mail.from=no-reply@naavi-trails.fr
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Naavi configuration
naavi.internal.api-key=defaultApiKey