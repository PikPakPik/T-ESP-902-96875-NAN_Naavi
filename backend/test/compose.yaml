services:
  spring:
    build:
      context: .
      dockerfile: .docker/java/Dockerfile
    volumes:
      - .docker/java/watch.sh:/usr/share/watch.sh
      - ./spring:/usr/share/app
      - ~/.m2:/root/.m2
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_OUTPUT_ANSI_ENABLED: ALWAYS
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_DEVTOOLS: DEBUG
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/naavi_authentication
      SPRING_DATASOURCE_USERNAME: naavi
      SPRING_DATASOURCE_PASSWORD: naavi
  
  database:
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: naavi
      POSTGRES_PASSWORD: naavi
      POSTGRES_DB: naavi_authentication

volumes:
  postgres_data: