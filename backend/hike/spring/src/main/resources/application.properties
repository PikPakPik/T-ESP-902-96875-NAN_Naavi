spring.application.name=Naavi Hike Production

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# Hibernate Spatial/PostGIS
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
jwt.issuer=${JWT_ISSUER:hike}
jwt.default.private=${JWT_DEFAULT_PRIVATE:/usr/share/default.private.pem}
jwt.default.public=${JWT_DEFAULT_PUBLIC:/usr/share/default.public.pem}
jwt.default.password=${JWT_DEFAULT_PASSWORD:defaultPassword}

jwt.auth.private=${JWT_AUTH_PRIVATE:/usr/share/auth.private.pem}
jwt.auth.public=${JWT_AUTH_PUBLIC:/usr/share/auth.public.pem}
jwt.auth.password=${JWT_AUTH_PASSWORD:defaultPassword}

jwt.exchange.private=${JWT_EXCHANGE_PRIVATE:/usr/share/exchange.private.pem}
jwt.exchange.public=${JWT_EXCHANGE_PUBLIC:/usr/share/exchange.public.pem}
jwt.exchange.password=${JWT_EXCHANGE_PASSWORD:defaultPassword}

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<login user to smtp server>
spring.mail.password=<login password to smtp server>
spring.mail.from=no-reply@naavi-trails.fr
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Naavi configuration
naavi.internal.api-key=${NAAVI_INTERNAL_API-KEY:defaultApiKey}
s3.endpoint=http://minio:9000
s3.access-key=minio
s3.secret-key=miniopwd

# OpenAPI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.configUrl=/hike/api-docs/swagger-config
springdoc.swagger-ui.url=/hike/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.server-url=http://api.naavi.local/hike/
springdoc.swagger-ui.title=Naavi Hike API

spring.sql.init.mode=never
spring.sql.init.platform=postgresql

spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.file-size-threshold=-1

server.tomcat.max-http-form-post-size=104857600
server.tomcat.max-swallow-size=104857600
