apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: prod-apps
  namespace: argocd-image-updater-system
spec:
  namespace: argocd
  commonUpdateSettings:
    updateStrategy: latest
    allowTags: "regexp:^linux-v[0-9]+-[0-9]+-[0-9]+$"
    pullSecret: pullsecret:argocd-image-updater-system/gitlab-registry-secret
  applicationRefs:
    - namePattern: "backoffice-prod"
      images:
        - alias: backoffice
          imageName: registry.gitlab.com/epitech-msc-2026/frontend/web/backoffice
    - namePattern: "landing-page-prod"
      images:
        - alias: landing-page
          imageName: registry.gitlab.com/epitech-msc-2026/frontend/web/landing-page
    - namePattern: "identity-prod"
      images:
        - alias: identity
          imageName: registry.gitlab.com/epitech-msc-2026/backend/identity
    - namePattern: "hike-prod"
      images:
        - alias: hike
          imageName: registry.gitlab.com/epitech-msc-2026/backend/hike
