apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backoffice-ingress
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: backoffice.naavi-trails.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backoffice
                port:
                  number: 80 