apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/epitech-msc-2026/infra/argocd/apps.git
    targetRevision: main
    path: prod/database
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

