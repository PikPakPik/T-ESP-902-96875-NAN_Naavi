apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hike-ingress
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: naavi-trails.fr
      http:
        paths:
          - path: /api/v1/hike
            pathType: Prefix
            backend:
              service:
                name: hike
                port:
                  number: 80

