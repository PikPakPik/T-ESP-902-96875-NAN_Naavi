apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
  namespace: prod
  labels:
    app: landing-page
spec:
  replicas: 2
  selector:
    matchLabels:  
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
    spec:
      containers:
        - name: landing-page
          image: registry.gitlab.com/epitech-msc-2026/frontend/web/landing-page:linux-v1-1-2
          imagePullPolicy: Always
          ports:
            - containerPort: 4220
      imagePullSecrets:
        - name: gitlab-registry-secret