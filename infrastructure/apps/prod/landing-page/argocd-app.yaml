apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: landing-page-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/epitech-msc-2026/infra/argocd/apps.git
    targetRevision: main
    path: prod/landing-page
    kustomize:
      namePrefix: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true