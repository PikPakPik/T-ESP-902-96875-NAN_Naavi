apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
  labels:
    app: promtail
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 9095
    
    positions:
      filename: /tmp/positions.yaml
    
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    
    scrape_configs:
      # Logs from develop namespace
      - job_name: kubernetes-pods-develop
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - develop
        pipeline_stages:
          - cri: {}
          # Extraire le level depuis le JSON (LogstashEncoder produit {"level":"INFO",...})
          - json:
              expressions:
                level: level
          # Fallback : si le log n'est pas JSON, essayer regex classique
          - regex:
              expression: '(?i)\[(?P<level>ERROR|WARN|WARNING|DEBUG|INFO|FATAL|TRACE|PANIC)\]'
          - template:
              source: level
              template: '{{ if .level }}{{ .level | ToLower }}{{ else }}info{{ end }}'
          - labels:
              level:
          # Label statique environment=develop
          - static_labels:
              environment: develop
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: __host__
          # K3s/containerd : /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
          - source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_name
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            separator: /
            regex: (.+)/(.+)/(.+)/(.+)
            target_label: __path__
            replacement: /var/log/pods/${1}_${2}_${3}/${4}/*.log
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node_name
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: app
          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container
          - source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_label_app
            separator: /
            regex: (.+)/(.+)
            target_label: job
            replacement: ${1}/${2}
          - source_labels:
              - __meta_kubernetes_pod_uid
            target_label: pod_uid
        
      # Logs from prod namespace
      - job_name: kubernetes-pods-prod
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - prod
        pipeline_stages:
          - cri: {}
          # Extraire le level depuis le JSON (LogstashEncoder produit {"level":"INFO",...})
          - json:
              expressions:
                level: level
          # Fallback : si le log n'est pas JSON, essayer regex classique
          - regex:
              expression: '(?i)\[(?P<level>ERROR|WARN|WARNING|DEBUG|INFO|FATAL|TRACE|PANIC)\]'
          - template:
              source: level
              template: '{{ if .level }}{{ .level | ToLower }}{{ else }}info{{ end }}'
          - labels:
              level:
          # Label statique environment=prod
          - static_labels:
              environment: prod
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: __host__
          # K3s/containerd : /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
          - source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_name
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            separator: /
            regex: (.+)/(.+)/(.+)/(.+)
            target_label: __path__
            replacement: /var/log/pods/${1}_${2}_${3}/${4}/*.log
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node_name
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: app
          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container
          - source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_label_app
            separator: /
            regex: (.+)/(.+)
            target_label: job
            replacement: ${1}/${2}
          - source_labels:
              - __meta_kubernetes_pod_uid
            target_label: pod_uid
