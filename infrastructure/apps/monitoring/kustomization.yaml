apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  # Namespace (créé en premier)
  - namespace.yaml
  # Loki
  - loki/configmap.yaml
  - loki/deployment.yaml
  - loki/service.yaml
  - loki/pvc.yaml
  
  # Promtail
  - promtail/configmap.yaml
  - promtail/daemonset.yaml
  - promtail/serviceaccount.yaml
  - promtail/clusterrole.yaml
  - promtail/clusterrolebinding.yaml
  
  # Prometheus
  - prometheus/configmap.yaml
  - prometheus/serviceaccount.yaml
  - prometheus/clusterrole.yaml
  - prometheus/clusterrolebinding.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  
  # Grafana
  - grafana/configmap-datasources.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  - grafana/ingress.yaml
  - grafana/pvc.yaml
  
  # GitLab CI Pipelines Exporter
  - gitlab-ci-pipelines-exporter/configmap.yaml
  - gitlab-ci-pipelines-exporter/deployment.yaml
  - gitlab-ci-pipelines-exporter/service.yaml

  # GitLab KPIs Exporter
  - gitlab-kpis-exporter/configmap.yaml
  - gitlab-kpis-exporter/deployment.yaml
  - gitlab-kpis-exporter/service.yaml

# Note: Les dashboards Grafana peuvent être ajoutés plus tard
# Pour ajouter des dashboards, décommentez le configMapGenerator ci-dessous
# et créez les fichiers JSON correspondants dans grafana/
#
# configMapGenerator:
#   - name: grafana-dashboards
#     files:
#       - dashboard-logs.json=grafana/dashboard-logs.json
#       - dashboard-applications.json=grafana/dashboard-applications.json
#     options:
#       labels:
#         app: grafana
