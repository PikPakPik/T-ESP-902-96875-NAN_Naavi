apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: true
        jsonData:
          maxLines: 1000
          derivedFields:
            - matcherRegex: '"(?:traceId|trace_id)":"([a-f0-9]{16,32})"'
              name: TraceID
              url: 'https://seq.dev.naavi-trails.fr/#/events?filter=@TraceId%3D%27${__value.raw}%27'
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: false
        jsonData:
          httpMethod: POST
          queryTimeout: 60s
          timeInterval: 15s
