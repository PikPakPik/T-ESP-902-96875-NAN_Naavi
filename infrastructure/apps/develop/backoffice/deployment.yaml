apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice
  namespace: develop
  labels:
    app: backoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backoffice
  template:
    metadata:
      labels:
        app: backoffice
    spec:
      containers:
        - name: backoffice
          image: registry.gitlab.com/epitech-msc-2026/frontend/web/backoffice:linux-develop
          imagePullPolicy: Always
          ports:
            - containerPort: 4200
      imagePullSecrets:
        - name: gitlab-registry-secret 