apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: develop
  labels:
    app: pgdata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Optionnel : spécifier un storageClassName si vous avez un storage class spécifique
  # storageClassName: standard
