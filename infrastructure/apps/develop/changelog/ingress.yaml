# Redirections dev.naavi-trails.fr/changelog* → GitLab Pages (changelog develop)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changelog-mobile-ingress
  namespace: develop
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      return 302 https://epitech-msc-2026.gitlab.io/changelog/develop/mobile/changelog.json;
spec:
  rules:
    - host: dev.naavi-trails.fr
      http:
        paths:
          - path: /changelog/mobile
            pathType: Prefix
            backend:
              service:
                name: landing-page
                port:
                  number: 4220
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changelog-backoffice-ingress
  namespace: develop
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      return 302 https://epitech-msc-2026.gitlab.io/changelog/develop/backoffice/changelog.json;
spec:
  rules:
    - host: dev.naavi-trails.fr
      http:
        paths:
          - path: /changelog
            pathType: Prefix
            backend:
              service:
                name: landing-page
                port:
                  number: 4220
