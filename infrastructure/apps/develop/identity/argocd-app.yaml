apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-develop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/epitech-msc-2026/infra/argocd/apps.git
    targetRevision: main
    path: develop/identity
    kustomize:
      namePrefix: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: develop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true 
